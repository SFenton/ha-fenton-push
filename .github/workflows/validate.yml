name: Validate

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install pytest pytest-homeassistant-custom-component h2
      - name: Unit tests
        # No Home Assistant: the plugin's autouse fixtures need its event loop.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/unit
      - name: Home Assistant tests
        run: python -m pytest -q tests/ha --asyncio-mode=auto
